[project]
name = "git-archaeologist"
version = "0.1.0"
description = "Local AI system for explaining repository history and change risk with evidence."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_archaeologist"]

[tool.uv]
package = true
